name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. No job here writes to the repo — they check
# out, run checks, or hand work to EAS/Telegram over their own secrets — so the
# repo-wide default scope is more than any of them needs. Set at the top level
# so it covers every job in the file, including the reusable-workflow call
# (a called workflow gets the intersection of its own permissions and these).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # A lockfile inside a workspace makes `yarn install --frozen-lockfile`
      # at the root resolve against the wrong tree, permanently and quietly.
      # `create-next-app` drops one, which is why this guard arrives before
      # `apps/web` does. Both commands are needed: the second catches an
      # untracked one on a developer's machine, and prints nothing for a
      # *committed* one — and CI checks out clean, so on its own it would pass
      # on exactly the case that breaks.
      - name: No stray workspace lockfiles
        run: |
          set -u
          patterns=(
            'apps/*/yarn.lock' 'apps/*/package-lock.json'
            'apps/*/pnpm-lock.yaml' 'apps/*/bun.lock'
          )
          tracked=$(git ls-files -- "${patterns[@]}")
          present=$(git status --porcelain --ignored -- "${patterns[@]}")
          if [ -n "$tracked" ] || [ -n "$present" ]; then
            echo "::error::A workspace has its own lockfile. Delete it and" \
              "re-run \`yarn install\` from the repo root." >&2
            printf '%s\n' "$tracked" "$present" >&2
            exit 1
          fi

      # expo-env.d.ts is gitignored and normally written by `expo start`;
      # it declares the `*.css` module type theme.ts's side-effect import
      # needs. Write it here so tsc sees the same types a local run does.
      - name: Generate Expo env types
        run: |
          printf '/// <reference types="expo/types" />\n\n// NOTE: This file should not be edited and should be in your git ignore\n' > apps/mobile/expo-env.d.ts

      # One step per app rather than one `yarn typecheck`, so the Telegram
      # message names the app that broke. There is deliberately no root
      # tsconfig to check them both at once: a `files: []` stub would let
      # `tsc --noEmit` succeed while checking nothing, and compiling core once
      # inside each app *is* the platform-drift detector.
      - name: Typecheck apps/mobile
        run: yarn typecheck:mobile

      - name: Lint
        run: yarn lint

      # Two coverage gates, not one merged number: coverage does not cross a
      # `rootDir` boundary, so the mobile run cannot measure core even though
      # it executes it. There is no `apps/web` step until Phase 3 — it would
      # fail "Unknown workspace" for the whole of Phase 2.
      - name: Test apps/mobile
        run: yarn workspace @brelly/mobile test:coverage

      # Same suite as the one apps/mobile's run picks up, different seams.
      # There `@brelly/platform/*` resolves to the Expo implementations, so
      # that run proves core works on a phone. This one resolves them to
      # platform-free fakes in a Node environment, which is what proves core
      # imports nothing secretly Expo-shaped — the question `apps/web` would
      # otherwise answer late, by way of a Next build failing on `react-native`.
      - name: Test packages/core standalone
        run: yarn workspace @brelly/core test:coverage

  # The local .githooks copies of these checks can be bypassed with --no-verify;
  # this one cannot.
  #
  # Dependabot is exempt. Its branch prefix is always `dependabot/` and is not
  # configurable, and its subjects carry a conventional-commit scope
  # (`chore(deps): bump ...`), so every dependency PR failed this job on naming
  # it cannot change. The convention exists to make *our* history findable;
  # a bot's history already is.
  conventions:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Branch name
        run: |
          branch='${{ github.head_ref }}'
          case "$branch" in
            feat/*|fix/*|chore/*) echo "ok: $branch" ;;
            *) echo "branch \"$branch\" must start with feat/, fix/, or chore/" >&2; exit 1 ;;
          esac

      - name: Commit subjects
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          fail=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*) continue ;;
            esac
            if printf '%s' "$subject" | grep -Eq '^(feat|fix|chore): .+'; then
              echo "ok:   $subject"
            else
              echo "fail: $subject" >&2
              fail=1
            fi
          done < <(git log --format=%s "$base"..HEAD)
          exit $fail

  # `always()` so a failed verify still reports; without it this job inherits
  # the default "only if the needs succeeded" and stays silent exactly when a
  # notification is most wanted. `conventions` is skipped on a push to main,
  # and a skipped need must not read as a failure.
  notify:
    needs: [verify, conventions]
    if: always()
    uses: ./.github/workflows/notify-telegram.yml
    with:
      status: >-
        ${{ (contains(needs.*.result, 'failure') && 'failure')
        || (contains(needs.*.result, 'cancelled') && 'cancelled')
        || 'success' }}
    secrets: inherit
