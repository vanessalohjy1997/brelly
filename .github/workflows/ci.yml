name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # expo-env.d.ts is gitignored and normally written by `expo start`;
      # it declares the `*.css` module type theme.ts's side-effect import
      # needs. Write it here so tsc sees the same types a local run does.
      - name: Generate Expo env types
        run: |
          printf '/// <reference types="expo/types" />\n\n// NOTE: This file should not be edited and should be in your git ignore\n' > expo-env.d.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:coverage

  # The local .githooks copies of these checks can be bypassed with --no-verify;
  # this one cannot.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Branch name
        run: |
          branch='${{ github.head_ref }}'
          case "$branch" in
            feat/*|fix/*|chore/*) echo "ok: $branch" ;;
            *) echo "branch \"$branch\" must start with feat/, fix/, or chore/" >&2; exit 1 ;;
          esac

      - name: Commit subjects
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          fail=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*) continue ;;
            esac
            if printf '%s' "$subject" | grep -Eq '^(feat|fix|chore): .+'; then
              echo "ok:   $subject"
            else
              echo "fail: $subject" >&2
              fail=1
            fi
          done < <(git log --format=%s "$base"..HEAD)
          exit $fail

  # `always()` so a failed verify still reports; without it this job inherits
  # the default "only if the needs succeeded" and stays silent exactly when a
  # notification is most wanted. `conventions` is skipped on a push to main,
  # and a skipped need must not read as a failure.
  notify:
    needs: [verify, conventions]
    if: always()
    uses: ./.github/workflows/notify-telegram.yml
    with:
      status: >-
        ${{ (contains(needs.*.result, 'failure') && 'failure')
        || (contains(needs.*.result, 'cancelled') && 'cancelled')
        || 'success' }}
    secrets: inherit
