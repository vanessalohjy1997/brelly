name: Telegram notification

# Called by the other workflows in this directory as their last job, so a run's
# result reaches a phone instead of a browser tab someone has to keep watching.
# `github.workflow` inside a reusable workflow is the *caller's* name, which is
# what makes one copy of this enough for all of them.
on:
  workflow_call:
    inputs:
      status:
        description: Aggregate result of the jobs being reported on
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ inputs.status }}
          WORKFLOW: ${{ github.workflow }}
          # head_ref is the PR's own branch; ref_name on a pull_request run is
          # the useless "17/merge".
          REF: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A fork's PR gets no secrets, and neither does anyone who clones this
          # repo without setting them up. Neither case should fail the run.
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set; skipping." >&2
            exit 0
          fi

          case "$STATUS" in
            success)   icon='✅' ;;
            failure)   icon='❌' ;;
            cancelled) icon='⚪️' ;;
            *)         icon='⚠️' ;;
          esac

          text="$icon $WORKFLOW $STATUS on $REF"$'\n'"$RUN_URL"

          curl -sS --fail-with-body \
            -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$text" \
            -d disable_web_page_preview=true
