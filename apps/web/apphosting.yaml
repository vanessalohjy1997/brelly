# Firebase App Hosting backend config for `@brelly/web`.
#
# This file is read from the backend's root directory (`apps/web`, set as
# `apphosting.rootDir` in the repo-root `firebase.json`). The archive that gets
# built is made from the *repo* root, so the Yarn workspace, the root lockfile
# and `packages/core` all travel with it — which is what a `rootDir` deeper than
# the workspace root is for.
#
# Two kinds of value live here and they are not interchangeable:
#
#   `availability: [BUILD]`   — needed while `next build` runs. Every
#                               `NEXT_PUBLIC_*` is in this class, because that
#                               prefix is a *literal text substitution* Next
#                               performs on the source: the value is baked into
#                               the browser bundle at build time, and a variable
#                               that only exists at RUNTIME is the string
#                               `undefined` in the shipped JS.
#   `availability: [RUNTIME]` — read by server code on each request. The Places
#                               key is RUNTIME-only, deliberately: a BUILD-time
#                               Places key is one `NEXT_PUBLIC_` typo away from
#                               the bundle, and the whole point of `/api/places`
#                               is that the browser never holds one.

runConfig:
  # Brelly's traffic is a handful of authenticated users checking a forecast.
  # `minInstances: 0` means cold starts; that is the right trade at this size —
  # a warm instance is billed around the clock to save a second or two a day.
  minInstances: 0
  # The ceiling exists to bound a bill, not to serve a load. `/api/places` is a
  # billed passthrough to Google, so runaway concurrency costs twice.
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public by design: these identify the project, they do not authorise
  # anything — `firestore.rules` is what does that. Same stance as
  # `apps/web/.env.example`, which already carries two of them in git.
  #
  # BUILD *and* RUNTIME: the browser bundle needs them inlined, and the server
  # half of `services/firebase.ts` reads the same `process.env` names during
  # SSR. Giving BUILD alone would make a server render see `undefined`.

  # ⚠ The load-bearing one. `signInWithPopup` bounces through
  # `https://<authDomain>/__/auth/handler`, and Safari's storage partitioning
  # breaks that hop when it is cross-site. Firebase Hosting serves `/__/**` from
  # `brelly-50de6.web.app` itself, so this value must stay equal to the origin
  # the app is served from — which is the Hosting site, not the App Hosting
  # `*.hosted.app` domain. Changing it to `.firebaseapp.com` here silently
  # reintroduces the Safari bug; changing it to the `hosted.app` domain breaks
  # sign-in outright. See WEB.md, "Hosting and popup auth".
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: brelly-50de6.web.app
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: brelly-50de6
    availability: [ BUILD, RUNTIME ]

  # A Secret Manager reference rather than a `value:`, and the reason is git,
  # not runtime secrecy — this key is inlined into the browser bundle either
  # way, so nothing here is hidden from anyone who loads the site. Committed,
  # it trips GitHub's secret scanner, which matches the shape every Google API
  # key shares and cannot tell a Firebase web config key from a billing
  # credential. The alert is a false positive; the triage it creates on a
  # public repo is not. `apps/mobile` already holds this line — `eas.json`
  # carries no values and no `google-services.json` is tracked — so no key
  # belonging to either app lives in the repo.
  #
  # BUILD is the load-bearing half. `NEXT_PUBLIC_*` is a literal text
  # substitution Next performs while building, so a secret available only at
  # RUNTIME is the string `undefined` in the shipped JS. RUNTIME is here for
  # the server half of `services/firebase.ts` during SSR.
  #
  # Create it with:
  #   firebase apphosting:secrets:set firebase-api-key --project brelly-50de6
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-api-key
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: brelly-50de6.firebasestorage.app
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 87595606048
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:87595606048:web:60f01a3341336f892ddc45
    availability: [ BUILD, RUNTIME ]
  - variable: GOOGLE_PLACES_KEY
    secret: google-places-key
